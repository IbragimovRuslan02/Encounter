name: CI

# Запускаем на push в main и на всех PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Lint and Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: "Lint with flake8"
        run: |
          # Stop the build if there are syntax errors or undefined names
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
          # Style warnings - non-blocking
          flake8 . \
            --count \
            --max-complexity=10 \
            --max-line-length=120 \
            --statistics \
            || echo "Style warnings found (non-blocking)"

      - name: "Smoke test - app can be imported"
        run: |
          python -c "
          from app import create_app
          app = create_app('testing')
          rules = list(app.url_map.iter_rules())
          n = len(rules)
          assert n >= 10, 'Expected >=10 routes, got %d' % n
          print('OK: App created. Routes registered:', n)
          "

      - name: "Smoke test - tests catalog is valid"
        run: |
          python -c "
          from app.tests_data import TESTS
          assert len(TESTS) >= 3, 'Expected >=3 tests, got %d' % len(TESTS)
          for test_id, test in TESTS.items():
              assert 'name' in test, '%s: missing name' % test_id
              assert 'questions' in test, '%s: missing questions' % test_id
              assert 'results' in test, '%s: missing results' % test_id
              assert len(test['questions']) == 15, '%s: expected 15 questions, got %d' % (test_id, len(test['questions']))
              for q in test['questions']:
                  assert len(q['options']) == 4, '%s: each question must have 4 options' % test_id
          print('OK: All %d tests are well-formed' % len(TESTS))
          "

      - name: "Smoke test - seed data initializes"
        run: |
          python -c "
          from app import create_app
          from app.extensions import db
          from app.seed import init_db
          app = create_app('testing')
          with app.app_context():
              db.drop_all()
              init_db()
              from app.models import User
              admin = User.query.filter_by(username='admin').first()
              assert admin is not None, 'Admin user not created'
              assert admin.is_admin, 'Admin user must be admin'
              assert admin.check_password('admin123'), 'Admin password does not match'
              print('OK: Seed data initialized correctly')
          "

  build-status:
    name: "Build status"
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: "Report"
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "All tests passed!"
          else
            echo "Some tests failed"
            exit 1
          fi
