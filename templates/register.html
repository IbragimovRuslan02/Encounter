{% extends "base.html" %}
{% block title %}Регистрация — Encounter{% endblock %}

{% block content %}
<section class="container mx-auto px-4 my-10">
  <div class="max-w-md mx-auto bg-white rounded-lg p-6 shadow-sm">
    <h1 class="text-xl font-semibold mb-2 text-center">Регистрация</h1>
    <p class="text-sm text-gray-500 mb-6 text-center">Создайте аккаунт</p>

    <form method="post" class="space-y-4">
      <div>
        <label class="text-sm text-gray-600">Логин</label>
        <input name="username" minlength="3" required
               class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <div>
        <label class="text-sm text-gray-600">Пароль</label>
        <input name="password" type="password" minlength="4" required
               class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <div>
        <label class="text-sm text-gray-600">Подтвердите пароль</label>
        <input name="confirm_password" type="password" minlength="4" required
               class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>

      <button class="w-full px-4 py-2 font-medium rounded-md text-white bg-gradient-to-r from-purple-600 to-pink-500 hover:from-pink-500 hover:to-yellow-500 transition">
        Зарегистрироваться →
      </button>
    </form>

    <div class="mt-4 text-center text-sm text-gray-500">
      Уже есть аккаунт? <a class="text-purple-600 hover:underline" href="{{ url_for('auth.login') }}">Войти</a>
    </div>
  </div>
</section>
{% endblock %}
