{% extends "base.html" %}
{% block title %}Настройки магазина — Encounter{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-1">Настройки магазина</h1>
<p class="text-gray-500 mb-6">Информация, которую видят покупатели</p>

<div class="bg-white rounded-lg p-6 border border-gray-100 max-w-2xl">
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="block text-sm font-medium mb-1">Название магазина *</label>
      <input type="text" name="shop_name" required value="{{ profile.shop_name }}"
             class="w-full px-3 py-2 border border-gray-200 rounded-md">
    </div>
    <div class="mb-3">
      <label class="block text-sm font-medium mb-1">Описание</label>
      <textarea name="shop_description" rows="4" class="w-full px-3 py-2 border border-gray-200 rounded-md">{{ profile.shop_description or '' }}</textarea>
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1">Баннер</label>
      {% if profile.banner %}
        <img src="{{ url_for('static', filename='uploads/' + profile.banner) }}" class="h-32 rounded mb-2 object-cover">
      {% endif %}
      <input type="file" name="banner" accept="image/*" class="text-sm w-full">
    </div>
    <button type="submit" class="px-5 py-2.5 bg-purple-600 text-white rounded-md hover:bg-purple-700">Сохранить</button>
  </form>
</div>
{% endblock %}
